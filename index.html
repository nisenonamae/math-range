<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>演習範囲</title>
<meta name="theme-color" content="#F5F1E8">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F5F1E8;--ink:#23201B;--sub:#7A7266;--rule:#DDD5C6;--card:#fff;--ok:#3D8A5A;--mid:#C08A1E;--ng:#B3283C;--none:#C9C2B4;--acc:#2F5D8A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;font-size:15px;line-height:1.6;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
body.embed{padding-bottom:0}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:1rem}
h1{font-size:1.2rem;margin:0 0 .8rem;letter-spacing:.1em}
.view[hidden],[hidden]{display:none !important}
.panel{border:1px solid var(--rule);border-radius:6px;background:var(--card);margin:.7rem 0;overflow:hidden}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.45rem .75rem;border-bottom:1px solid var(--rule);background:#FAF8F3;font-weight:700;font-size:.88rem}
.panel-b{padding:.6rem .75rem}
.empty{color:var(--sub);font-size:.86rem}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:4px;padding:.4rem .9rem;cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink)}.btn.sm{padding:.2rem .6rem;font-size:.84rem;font-weight:400}
.linkbtn{border:none;background:none;color:var(--acc);cursor:pointer;padding:0;font-size:.84rem}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.f label{display:block;font-size:.76rem;color:var(--sub);margin-bottom:.15rem}
.f input,.f select{width:100%;border:1px solid var(--rule);border-radius:4px;padding:.4rem .5rem;background:#fff}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.5rem}
.status{font-size:.84rem;color:var(--sub)}.status.err{color:var(--ng)}
/* 進み具合の帯:○△×未 */
.seg{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--none);margin:.35rem 0}
.seg i{display:block;height:100%}.seg .o{background:var(--ok)}.seg .t{background:var(--mid)}.seg .x{background:var(--ng)}
.legend{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.8rem;color:var(--sub)}
.legend b{color:var(--ink)}
.big{font-size:1.6rem;font-weight:700}
.range-card{border:1px solid var(--rule);border-radius:6px;padding:.6rem .75rem;margin:.5rem 0;background:#FDFCF9}
.range-card h3{margin:0;font-size:1rem;display:flex;justify-content:space-between;gap:.5rem}
.range-card h3 small{font-weight:400;color:var(--sub);font-size:.78rem}
.fields{display:grid;grid-template-columns:auto 1fr auto;gap:.2rem .6rem;font-size:.82rem;align-items:center;margin-top:.4rem}
.fbar{height:7px;background:var(--none);border-radius:4px;overflow:hidden}.fbar i{display:block;height:100%;background:var(--acc)}
.modes{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
.modes button{border:1px solid var(--rule);background:#fff;border-radius:14px;padding:.2rem .7rem;cursor:pointer;font-size:.84rem}
.modes button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
/* テスト */
.qcard{text-align:center;padding:1.4rem 1rem}
.qno{font-size:2.6rem;font-weight:700;line-height:1.2}
.qbook{color:var(--sub);font-size:.86rem}.qfields{margin:.4rem 0;display:flex;gap:.3rem;justify-content:center;flex-wrap:wrap}
.tag{font-size:.76rem;border:1px solid var(--rule);border-radius:10px;padding:0 .5rem;background:#fff}
.judge{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:1rem}
.judge button{border:2px solid;border-radius:10px;background:#fff;padding:.9rem 0;font-size:1.6rem;font-weight:700;cursor:pointer}
.judge .o{border-color:var(--ok);color:var(--ok)}.judge .t{border-color:var(--mid);color:var(--mid)}.judge .x{border-color:var(--ng);color:var(--ng)}
.judge small{display:block;font-size:.7rem;font-weight:400;color:var(--sub)}
.prog{font-size:.84rem;color:var(--sub);text-align:center}
/* 問題の一覧 */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.2rem,1fr));gap:.35rem}
.pcell{border:1px solid var(--rule);border-radius:5px;padding:.25rem .3rem;text-align:center;background:#fff;cursor:pointer;font-size:.82rem}
.pcell{position:relative}.pcell b{display:block;font-size:.95rem}.pcell .seq{position:absolute;top:1px;left:4px;font-size:.62rem;color:var(--sub)}.pcell .hist{letter-spacing:.05em}
.pcell.o{border-color:var(--ok);background:#EEF6F0}.pcell.t{border-color:var(--mid);background:#FBF3E2}.pcell.x{border-color:var(--ng);background:#F9E7EA}
.mk-o{color:var(--ok)}.mk-t{color:var(--mid)}.mk-x{color:var(--ng)}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.chips label{font-size:.82rem;border:1px solid var(--rule);border-radius:12px;padding:.05rem .55rem;background:#fff}
.clock{text-align:center;margin:.4rem 0}.clock b{font-size:1.5rem;font-variant-numeric:tabular-nums}.clock span{display:block;font-size:.78rem;color:var(--sub)}
.clock.over b{color:var(--ng)}.clock.paused b{color:var(--sub)}.paused-card{opacity:.45}
.lrow{display:grid;grid-template-columns:minmax(6rem,1.2fr) auto 1fr auto;gap:.3rem .6rem;align-items:center;padding:.3rem 0;border-bottom:1px dashed var(--rule);font-size:.86rem}
.lrow .fbar{min-width:4rem}.lv-n{font-weight:700;font-variant-numeric:tabular-nums}.lv-s{font-size:.75rem;color:var(--sub)}
.lrange{padding:.35rem 0;border-bottom:1px dashed var(--rule)}
.lv{font-size:.72rem;border-radius:3px;padding:0 .35rem;margin-left:.3rem;white-space:nowrap}
.lv-good,.lvc-完成{background:#E2EFE6;color:#2F6E44}.lvc-定着{background:#EAF2EC;color:#3D8A5A}.lvc-不安定{background:#FBF3E2;color:#8A5A00}.lv-bad,.lvc-苦手{background:#F9E7EA;color:#B3283C}.lvc-未着手{background:#F1EEE7;color:var(--sub)}
.lvbar{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.5rem}.lv-b{border:1px solid var(--rule);border-radius:12px;padding:.1rem .6rem;cursor:pointer;font-size:.8rem}
.lv-b[aria-pressed="true"]{outline:2px solid var(--ink)}
.seq2{font-size:.66rem;color:var(--sub);margin-right:.3rem}
.panel-h select{font-size:.8rem;font-weight:400;border:1px solid var(--rule);border-radius:4px;padding:.1rem .3rem;background:#fff}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#FBF9F4;border-top:1px solid var(--rule);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:none;background:none;padding:.8rem 0;cursor:pointer;color:var(--sub);font-weight:700}
nav.tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}
body.embed nav.tabs{position:static;border:none;background:none;margin-bottom:.4rem}
</style>
</head>
<body>
<div class="wrap">
  <nav class="tabs" role="tablist">
    <button role="tab" data-view="range" aria-selected="true">範囲</button>
    <button role="tab" data-view="test" aria-selected="false">テスト</button>
    <button role="tab" data-view="look" aria-selected="false">見る</button>
    <button role="tab" data-view="probs" aria-selected="false">問題</button>
    <button role="tab" data-view="settings" aria-selected="false">設定</button>
  </nav>
  <section class="view" id="view-range"><div id="range"></div></section>
  <section class="view" id="view-test" hidden><div id="test"></div></section>
  <section class="view" id="view-look" hidden><div id="look"></div></section>
  <section class="view" id="view-probs" hidden><div id="probs"></div></section>
  <section class="view" id="view-settings" hidden>
    <h1>設定</h1>
    <div class="panel"><div class="panel-h">接続</div><div class="panel-b">
      <p class="empty" style="margin-top:0">行軍表・省アプリと同じトークンが使えます(同じ端末で入れてあれば自動で使います)。</p>
      <div class="grid2"><div class="f"><label>ユーザー名</label><input id="c-owner"></div><div class="f"><label>リポジトリ</label><input id="c-repo"></div><div class="f"><label>ブランチ</label><input id="c-branch"></div></div>
      <div class="f" style="margin-top:.4rem"><label>トークン</label><input id="c-token" type="password"></div>
      <div class="row" style="margin-top:.6rem"><button class="btn" id="connect" type="button">接続して読み込む</button><span class="status" id="conn-status"></span></div>
    </div></div>
    <p class="status" id="ver"></p>
  </section>
  <span class="status" id="msg"></span>
</div>
<script>
(function(){
"use strict";
const APP_VERSION = "2026-10-07 r3";
const DATA = "roadmap/apps/math-range/data.json";
const KEY_CONN = "mr-conn", KEY_CACHE = "mr-cache";
const MARKS = ["○", "△", "×"], SCORE = { "○": 1, "△": 0.5, "×": 0 }, CLS = { "○": "o", "△": "t", "×": "x" };
const state = { conn: null, doc: null, sha: null, view: "range", sel: { book: null, prob: null }, mode: {}, session: null, lastTest: null };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lsGet = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => window.__mrToday || new Date(Date.now() + 4 * 3600e3).toISOString().slice(0, 10);
const rnd = n => Math.floor((window.__mrRandom ? window.__mrRandom() : Math.random()) * n);
const say = (t, err) => { const el = document.getElementById("msg"); el.textContent = t; el.classList.toggle("err", !!err); };
// どの省・ページから開かれたか(省アプリのページに置かれたとき)
const q = new URLSearchParams(location.search);
const ctx = { page: q.get("page") || "", label: q.get("label") || "", tag: q.get("tag") || "" };
const emptyDoc = () => ({ version: 1, books: [], fields: [], problems: [], ranges: [], tests: [] });
/* ───── GitHub ───── */
function b64e(str){ const b = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function b64d(b64){ const bin = atob(String(b64).replace(/\s/g, "")); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); }
const repo = () => "https://api.github.com/repos/" + encodeURIComponent(state.conn.owner) + "/" + encodeURIComponent(state.conn.repo);
const hdr = x => Object.assign({ "Authorization": "Bearer " + state.conn.token, "Accept": "application/vnd.github+json" }, x || {});
async function fetchRetry(url, opts){ let last; for (let i = 0; i < 3; i++) { try { return await fetch(url, opts); } catch (e) { last = e; await new Promise(r => setTimeout(r, 500 * (i + 1))); } } throw last; }
function httpErr(st, p){ const e = new Error(st === 401 ? "トークンが無効です。設定から入れ直してください。" : "GitHubとの通信に失敗しました(" + st + " " + p + ")。"); e.status = st; return e; }
async function readJson(path){
  const url = repo() + "/contents/" + path + "?ref=" + encodeURIComponent(state.conn.branch);
  const r = await fetchRetry(url, { headers: hdr(), cache: "no-store" });
  if (r.status === 404) return { data: null, sha: null };
  if (!r.ok) throw httpErr(r.status, path);
  const meta = await r.json();
  let text = meta.content ? b64d(meta.content) : null;
  if (text == null) text = await (await fetchRetry(url, { headers: hdr({ "Accept": "application/vnd.github.raw+json" }), cache: "no-store" })).text();
  return { data: JSON.parse(text), sha: meta.sha };
}
async function writeJson(path, obj, sha, msg){
  const body = { message: msg || "思案を更新", content: b64e(JSON.stringify(obj, null, 1)), branch: state.conn.branch };
  if (sha) body.sha = sha;
  const r = await fetchRetry(repo() + "/contents/" + path, { method: "PUT", headers: hdr({ "Content-Type": "application/json" }), body: JSON.stringify(body) });
  if (!r.ok) throw httpErr(r.status, path);
  return (await r.json()).content.sha;
}
async function load(){
  if (!state.conn || !state.conn.token) { show("settings"); return false; }
  try {
    const r = await readJson(DATA);
    state.doc = Object.assign(emptyDoc(), r.data || {}); state.sha = r.sha;
    lsSet(KEY_CACHE, { doc: state.doc, sha: state.sha }); render(); return true;
  } catch (e) { say(e.message, true); return false; }
}
async function commit(mutate){
  mutate(state.doc); render();
  for (let i = 0; i < 3; i++) {
    try { state.sha = await writeJson(DATA, state.doc, state.sha); lsSet(KEY_CACHE, { doc: state.doc, sha: state.sha }); return true; }
    catch (e) {
      if ((e.status === 409 || e.status === 422) && i < 2) { const f = await readJson(DATA); state.doc = Object.assign(emptyDoc(), f.data || {}); state.sha = f.sha; mutate(state.doc); render(); continue; }
      say(e.message, true); return false;
    }
  }
  return false;
}

/* ───── 数える ───── */
const D = () => state.doc;
const book = id => D().books.find(b => b.id === id);
const field = id => D().fields.find(f => f.id === id);
// 問題の並べ方:名前の中の数字を数として並べる(例1-2 の次は 例1-3、例1-10 はそのあと)
const byNo = (a, b) => String(a.no).localeCompare(String(b.no), "ja", { numeric: true });
function history(pid){ return D().tests.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0).filter(t => t.results[pid]).map(t => ({ mark: t.results[pid], date: t.date })); }
const latest = pid => { const h = history(pid); return h.length ? h[h.length - 1].mark : null; };
// 教材の問題を並べた順の通し番号(1、2、3…)
const bookProblems = bk => D().problems.filter(p => p.book === bk && !p.deleted).sort(byNo);
const seqOf = p => bookProblems(p.book).findIndex(x => x.id === p.id) + 1;
// 「1-10, 15, 20-25」を通し番号の並びに
function parseSeq(t, max){
  const out = new Set();
  String(t || "").split(/[、,,\s]+/).filter(Boolean).forEach(x => { const m = /^(\d+)\s*[-〜~]\s*(\d+)$/.exec(x);
    if (m) { for (let i = Math.min(+m[1], +m[2]); i <= Math.max(+m[1], +m[2]); i++) if (i >= 1 && i <= max) out.add(i); }
    else if (/^\d+$/.test(x) && +x >= 1 && +x <= max) out.add(+x); });
  return Array.from(out).sort((a, b) => a - b);
}
// 通し番号の並びを「1-10, 15」のように短く
function seqText(nums){ const out = []; let a = null, b = null;
  nums.forEach(n => { if (a == null) { a = b = n; } else if (n === b + 1) b = n; else { out.push(a === b ? a : a + "-" + b); a = b = n; } });
  if (a != null) out.push(a === b ? a : a + "-" + b); return out.join(", "); }
// 範囲:決めたときの問題で固定(あとから問題を足してもずれない)
function rangeProblems(r){
  const ps = bookProblems(r.book);
  if (Array.isArray(r.ids)) { const set = new Set(r.ids); return ps.filter(p => set.has(p.id)); }
  let a = 0, z = ps.length - 1;
  if (r.fromId) { const i = ps.findIndex(p => p.id === r.fromId); if (i >= 0) a = i; }
  if (r.toId) { const i = ps.findIndex(p => p.id === r.toId); if (i >= 0) z = i; }
  return a <= z ? ps.slice(a, z + 1) : ps.slice(z, a + 1);
}
const rangeText = r => seqText(rangeProblems(r).map(seqOf));
function stats(ps){
  const c = { "○": 0, "△": 0, "×": 0, none: 0 }; let sum = 0, n = 0;
  ps.forEach(p => { const m = latest(p.id); if (m) { c[m]++; sum += SCORE[m]; n++; } else c.none++; });
  return { c, total: ps.length, rate: n ? sum / n : null };
}
function fieldStats(ps){
  const out = {};
  ps.forEach(p => { const m = latest(p.id); (p.fields || []).forEach(f => { const o = out[f] = out[f] || { sum: 0, n: 0, all: 0 }; o.all++; if (m) { o.sum += SCORE[m]; o.n++; } }); });
  return Object.entries(out).map(([f, o]) => ({ f, name: (field(f) || {}).name || "?", rate: o.n ? o.sum / o.n : null, all: o.all, n: o.n }))
    .sort((a, b) => (a.rate == null ? 2 : a.rate) - (b.rate == null ? 2 : b.rate));
}
const pct = x => x == null ? "—" : Math.round(x * 100) + "%";
function segHtml(s){
  const w = k => s.total ? (s.c[k] / s.total * 100).toFixed(1) : 0;
  return '<div class="seg"><i class="o" style="width:' + w("○") + '%"></i><i class="t" style="width:' + w("△") + '%"></i><i class="x" style="width:' + w("×") + '%"></i></div>' +
    '<div class="legend"><span><b class="mk-o">○</b> ' + s.c["○"] + '</span><span><b class="mk-t">△</b> ' + s.c["△"] + '</span><span><b class="mk-x">×</b> ' + s.c["×"] + "</span><span>まだ " + s.c.none + "</span><span>正答率 <b>" + pct(s.rate) + "</b></span></div>";
}

/* ───── 範囲 ───── */
const MODES = [["all", "すべて"], ["new", "まだの問題"], ["weak", "苦手(×△)"], ["rand", "ランダム10題"]];
const KEY_SESSION = "mr-session";
const fmtSec = sec => { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); };
const nowMs = () => window.__mrNow ? window.__mrNow() : Date.now();
function saveSession(){ lsSet(KEY_SESSION, state.session); }
function rangeCard(r){
  const ps = rangeProblems(r), s = stats(ps), b = book(r.book) || {}, mode = state.mode[r.id] || "weak";
  const weak = ps.filter(p => ["×", "△"].includes(latest(p.id)));
  const fs = fieldStats(ps).filter(x => x.n);
  return '<div class="range-card" data-range="' + r.id + '"><h3><span>' + esc(r.name || b.name) + "</span><small>" + esc(b.name || "") + " " + esc(rangeText(r)) + " ・ " + ps.length + "題</small></h3>" +
    segHtml(s) +
    (weak.length ? '<div style="margin-top:.4rem;font-size:.82rem">苦手:' + weak.map(p => '<span class="mk-' + CLS[latest(p.id)] + '">' + esc(p.no) + "</span>").join(" ") + "</div>" : "") +
    (fs.length ? '<div class="fields">' + fs.slice(0, 6).map(x => "<span>" + esc(x.name) + '</span><span class="fbar"><i style="width:' + Math.round(x.rate * 100) + '%"></i></span><span>' + pct(x.rate) + "</span>").join("") + "</div>" : "") +
    '<div class="modes" role="group" aria-label="出し方">' + MODES.map(([k, l]) => '<button type="button" data-mode="' + r.id + ":" + k + '" aria-pressed="' + (mode === k) + '">' + l + "</button>").join("") + "</div>" +
    '<div class="row" style="margin-top:.5rem"><select data-time="' + r.id + '" aria-label="時間">' + [["none", "時間なし"], ["watch", "時間を測る"], ["per:3", "1題3分"], ["per:5", "1題5分"], ["per:10", "1題10分"], ["all:30", "全体30分"], ["all:60", "全体60分"]]
      .map(([k, l]) => '<option value="' + k + '"' + ((state.time || {})[r.id] === k ? " selected" : "") + ">" + l + "</option>").join("") + "</select>" +
    '<button type="button" class="btn" data-start="' + r.id + '">テストを始める</button>' +
    '<button type="button" class="linkbtn" data-range-del="' + r.id + '" style="margin-left:auto;color:var(--sub)">この範囲を消す</button></div></div>';
}
function rangeForm(){
  const books = D().books;
  if (!books.length) return '<div class="empty">まず「問題」のタブで教材と問題を足してください。</div>';
  const bk = state.rfBook && book(state.rfBook) ? state.rfBook : books[0].id, ps = bookProblems(bk);
  const pick = parseSeq(state.rfSeq || "", ps.length);
  return '<div class="grid2"><div class="f"><label>教材</label><select id="rf-book">' + books.map(b => '<option value="' + b.id + '"' + (b.id === bk ? " selected" : "") + ">" + esc(b.name) + "</option>").join("") + "</select></div>" +
    '<div class="f"><label>通し番号(1〜' + ps.length + '。例:1-10, 15, 20-25)</label><input id="rf-seq" value="' + esc(state.rfSeq || "") + '" placeholder="空なら全部"></div>' +
    '<div class="f"><label>名前</label><input id="rf-name" placeholder="' + esc(ctx.label || "例:2学期の範囲") + '" value="' + esc(ctx.label || "") + '"></div></div>' +
    (ps.length ? '<div class="empty" style="margin-top:.35rem">' + (pick.length ? pick.length + "題:" + pick.slice(0, 12).map(n => esc(ps[n - 1].no)).join("、") + (pick.length > 12 ? " …" : "") : "全部(" + ps.length + "題)") + "</div>" +

/* ───── テスト ───── */
function startTest(rid){
  const r = D().ranges.find(x => x.id === rid), ps = rangeProblems(r), mode = state.mode[rid] || "weak";
  let pool = mode === "new" ? ps.filter(p => !latest(p.id)) : mode === "weak" ? ps.filter(p => ["×", "△"].includes(latest(p.id))) : ps.slice();
  if (mode === "weak") pool.sort((a, b) => (latest(a.id) === "×" ? 0 : 1) - (latest(b.id) === "×" ? 0 : 1) || byNo(a, b));
  if (mode === "rand") { const a = ps.slice(), out = []; while (a.length && out.length < 10) out.push(a.splice(rnd(a.length), 1)[0]); pool = out; }
  if (!pool.length) { say(mode === "weak" ? "苦手な問題はありません。" : mode === "new" ? "まだの問題はありません。" : "問題がありません。", true); return; }
  const tm = (state.time || {})[rid] || "none", [tk, tv] = tm.split(":");
  state.session = { rid, mode, queue: pool.map(p => p.id), i: 0, results: {}, times: {}, timeouts: {},
    timing: tk, limit: tv ? +tv * 60 : null, total: 0, cur: 0, last: nowMs(), paused: false };
  saveSession(); say(""); show("test"); startClock();
}

// 時計:1秒ごとに今の問題と全体の時間を進める(一時停止中は止める)
function tickClock(){
  const s = state.session; if (!s || s.paused) return;
  const n = nowMs(), dt = (n - s.last) / 1000; s.last = n; s.total += dt; s.cur += dt;
  if (s.timing === "all" && s.limit && s.total >= s.limit) { finishTest(); return; }
  saveSession();
  const el = document.getElementById("clock"); if (el) el.outerHTML = clockHtml(s);
}
function startClock(){ clearInterval(state.clock); state.clock = setInterval(tickClock, 1000); }
function clockHtml(s){
  if (s.timing === "none") return '<div id="clock"></div>';
  const over = s.timing === "per" && s.limit && s.cur >= s.limit;
  const main = s.timing === "per" ? (over ? "時間切れ " + fmtSec(s.cur - s.limit) + "超過" : "残り " + fmtSec(s.limit - s.cur)) : s.timing === "all" ? "残り " + fmtSec(s.limit - s.total) : fmtSec(s.cur);
  return '<div id="clock" class="clock' + (over ? " over" : "") + (s.paused ? " paused" : "") + '"><b>' + main + "</b><span>全体 " + fmtSec(s.total) + (s.paused ? "・一時停止中" : "") + "</span></div>";
}
function recordAnswer(mark){
  const s = state.session, pid = s.queue[s.i];
  if (mark) { s.results[pid] = mark; s.times[pid] = Math.round(s.cur); if (s.timing === "per" && s.limit && s.cur >= s.limit) s.timeouts[pid] = true; }
  s.i++; s.cur = 0; s.last = nowMs(); saveSession();
}
async function finishTest(){
  const s = state.session; if (!s) return;
  state.session = null; clearInterval(state.clock); lsSet(KEY_SESSION, null);   // 先に閉じる(保存のあとの描き直しで、もう一度終えないように)
  const n = Object.keys(s.results).length;
  if (n) {
    const id = uid(), r = D().ranges.find(x => x.id === s.rid) || {};
    const t = { id, date: today(), name: (r.name || "テスト") + " " + (D().tests.filter(x => x.range === s.rid).length + 1) + "回目", range: s.rid, results: s.results,
      times: s.times, timeouts: s.timeouts, total: Math.round(s.total), timing: s.timing, limit: s.limit };
    await commit(doc => { doc.tests.push(t); });
    state.lastTest = id;
  }
  render(); show("test");
}
function renderTest(){

      '<p class="prog">' + (s.i + 1) + " / " + s.queue.length + "</p>" +

  const last = state.lastTest && D().tests.find(t => t.id === state.lastTest);

/* ───── 見る:分野・範囲・問題の練度を一覧で ───── */
const LV = ["完成", "定着", "不安定", "苦手", "未着手"];
function levelOf(pid){
  const h = history(pid); if (!h.length) return "未着手";
  const last = h[h.length - 1].mark;
  if (last === "×") return "苦手";
  if (last === "△") return "不安定";
  const tail = h.slice(-3);
  if (tail.length === 3 && tail.every(x => x.mark === "○") && (Date.parse(tail[2].date) - Date.parse(tail[0].date)) >= 7 * 864e5) return "完成";
  if (h.length >= 2 && h[h.length - 2].mark === "○") return "定着";
  return h.length >= 2 ? "不安定" : "定着";
}
function avgTime(pid){ const ts = D().tests.map(t => (t.times || {})[pid]).filter(x => x != null); return ts.length ? ts.reduce((a, b) => a + b, 0) / ts.length : null; }

    '<div class="panel"><div class="panel-h"><span>範囲</span></div><div class="panel-b">' + (rs.length ? rs.map(rRow).join("") : '<div class="empty">まだ範囲がありません。</div>') + "</div></div>" +
    '<div class="panel"><div class="panel-h"><span>問題ごとの練度</span><select id="lk-book"><option value="">すべての教材</option>' + D().books.map(b => '<option value="' + b.id + '"' + (b.id === bkSel ? " selected" : "") + ">" + esc(b.name) + "</option>").join("") + "</select></div>" +

// まとめて足す:「1-40」「例1-1〜例1-12」「例1-1〜12」「例題3」を問題の名前の並びに
function parseNos(t){
  const out = [];
  String(t).split(/[、,,\s]+/).filter(Boolean).forEach(x => {
    let m;
    if ((m = /^(\d+)\s*[-〜~]\s*(\d+)$/.exec(x))) { for (let i = +m[1]; i <= +m[2] && out.length < 1000; i++) out.push(String(i)); return; }
    // 名前の最後の数字だけを増やす:例1-1〜例1-12、例1-1〜12
    if ((m = /^(.*?)(\d+)\s*[〜~]\s*(.*?)(\d+)$/.exec(x)) && (m[3] === "" || m[3] === m[1])) {
      for (let i = +m[2]; i <= +m[4] && out.length < 1000; i++) out.push(m[1] + i); return; }
    out.push(x);
  });
  return out;
}

    if (s && e.target.closest("[data-quit]")) { if (!confirm("テストをやめますか。このテストの判定は記録されません。")) return; state.session = null; clearInterval(state.clock); lsSet(KEY_SESSION, null); say("テストをやめました"); renderTest(); return; }
    if (s && e.target.closest("[data-stop]")) { tickClock(); await finishTest(); return; }
    if (!s && e.target.closest("[data-resume]")) { const h = lsGet(KEY_SESSION, null); if (!h) return; h.paused = false; h.last = nowMs(); state.session = h; saveSession(); startClock(); renderTest(); return; }
    if (!s && e.target.closest("[data-discard]")) { if (!confirm("中断しているテストをやめますか。記録されません。")) return; lsSet(KEY_SESSION, null); renderTest(); return; }
  });
  document.getElementById("probs").addEventListener("change", async e => {
    if (e.target.id === "pb-book") { state.sel.book = e.target.value; state.sel.prob = null; renderProbs(); return; }
    const pf = e.target.closest("[data-pf]");
    if (pf) { const id = state.sel.prob, f = pf.dataset.pf, on = pf.checked; await commit(doc => { const p = doc.problems.find(x => x.id === id); p.fields = (p.fields || []).filter(x => x !== f).concat(on ? [f] : []); }); }
  });
  document.getElementById("probs").addEventListener("click", async e => {
    let b; const v = id => (document.getElementById(id) || {}).value || "";
    if (e.target.id === "pb-addbook") { const n = v("pb-newbook").trim(); if (!n) return; const id = uid(); await commit(doc => { doc.books.push({ id, name: n, created: today() }); }); state.sel.book = id; renderProbs(); return; }
    if (e.target.id === "pb-addfield") { const n = v("pb-newfield").trim(); if (!n || D().fields.some(f => f.name === n)) return; await commit(doc => { doc.fields.push({ id: uid(), name: n }); }); return; }
    if (e.target.id === "pb-addprobs") {
      const bk = state.sel.book, nos = parseNos(v("pb-nos")); if (!bk || !nos.length) return;
      const fs = Array.from(document.querySelectorAll("#pb-addfields input:checked")).map(x => x.value);
      const have = new Set(D().problems.filter(p => p.book === bk && !p.deleted).map(p => String(p.no)));
      const add = nos.filter(n => !have.has(n));
      await commit(doc => { add.forEach(n => doc.problems.push({ id: uid() + n, book: bk, no: n, fields: fs.slice() })); });
      say(add.length + "題足しました" + (nos.length > add.length ? "(" + (nos.length - add.length) + "題はもうありました)" : "")); return;
    }
    if ((b = e.target.closest("[data-prob]"))) { state.sel.prob = b.dataset.prob; renderProbs(); return; }
    if (e.target.closest("[data-prob-close]")) { state.sel.prob = null; renderProbs(); return; }
    if (e.target.closest("[data-prob-del]")) { if (!confirm("この問題を消しますか。")) return; const id = state.sel.prob; await commit(doc => { doc.problems.find(p => p.id === id).deleted = today(); }); state.sel.prob = null; renderProbs(); return; }
  });
  document.getElementById("look").addEventListener("click", e => { const b = e.target.closest("[data-lv]"); if (!b) return; state.lookLv = state.lookLv === b.dataset.lv ? "" : b.dataset.lv; renderLook(); });
  document.getElementById("look").addEventListener("change", e => { if (e.target.id === "lk-book") { state.lookBook = e.target.value; renderLook(); } });
  document.getElementById("connect").addEventListener("click", async () => {
    const v = id => document.getElementById(id).value.trim();
    state.conn = { owner: v("c-owner"), repo: v("c-repo"), branch: v("c-branch") || "main", token: v("c-token") };
    lsSet(KEY_CONN, state.conn); document.getElementById("conn-status").textContent = (await load()) ? "読み込みました" : "";
    if (D()) show("range");
  });
}
function boot(){
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
  if (ctx.page) document.body.classList.add("embed");
  bind();
  document.getElementById("ver").textContent = "版 " + APP_VERSION;
  // 接続:自分のものが無ければ、同じ端末の行軍表・省・思案のものを使う
  const c = lsGet(KEY_CONN, null) || lsGet("roadmap-conn", null) || lsGet("sho-conn", null) || lsGet("shian-conn", null);
  document.getElementById("c-owner").value = c ? c.owner : "nisenonamae";
  document.getElementById("c-repo").value = c ? c.repo : "notion-daily";
  document.getElementById("c-branch").value = c ? (c.branch || "main") : "main";
  document.getElementById("c-token").value = c ? c.token : "";
  const cache = lsGet(KEY_CACHE, null);
  if (cache && cache.doc) { state.doc = Object.assign(emptyDoc(), cache.doc); state.sha = cache.sha; render(); }
  if (c && c.token) { state.conn = c; load(); } else show("settings");
}
window.__mr = { levelOf, parseSeq, seqText, tickClock, state, rangeProblems, stats, latest, parseNos };
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
